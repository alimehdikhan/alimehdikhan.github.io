name: Deploy Next.js site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Clean install dependencies
        run: |
          rm -rf node_modules
          npm ci
      - name: Build with Next.js
        run: npm run build
        env:
          # read at build time for the open-source pull requests (lib/github.js)
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Wait before deploy (avoids Pages backend race condition)
        run: sleep 30

      - name: Deploy to GitHub Pages (attempt 1)
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Deploy to GitHub Pages (attempt 2)
        if: steps.deployment.outcome == 'failure'
        id: deployment_retry
        uses: actions/deploy-pages@v4

      # IndexNow tells Bing (and through it ChatGPT search and Copilot),
      # Yandex and others that the page changed, so they re-read it within
      # minutes. The key is public by design: the file of the same name in
      # public/ proves the site owns it.
      - name: Tell search engines the site changed (IndexNow)
        continue-on-error: true
        env:
          KEY: d4897ca4820a916be4ebef3eaa23bf21
          SITE: https://alimehdikhan.github.io
        run: >-
          curl -sS -o /dev/null -w "IndexNow: HTTP %{http_code}\n"
          -X POST https://api.indexnow.org/indexnow
          -H 'Content-Type: application/json; charset=utf-8'
          -d "{\"host\":\"alimehdikhan.github.io\",\"key\":\"$KEY\",\"keyLocation\":\"$SITE/$KEY.txt\",\"urlList\":[\"$SITE/\",\"$SITE/projects/vocaly-ai\",\"$SITE/projects/skin-lesion-classifier\",\"$SITE/projects/byte\",\"$SITE/llms.txt\",\"$SITE/llms-full.txt\"]}"
